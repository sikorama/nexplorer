name: Release

# Runs when a GitHub Release is published, or by hand (artifacts only, nothing attached).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # attach the file to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag against the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python packaging/check_release_tag.py "$TAG"

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libxcb-cursor0

      - name: Build the AppImage
        run: packaging/build-linux.sh

      - name: Smoke test
        run: packaging/smoke-test.sh dist/nexplorer-v*-linux-x86_64.AppImage

      - name: Upload as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nexplorer-linux-x86_64
          path: dist/nexplorer-v*-linux-x86_64.AppImage
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/nexplorer-v*-linux-x86_64.AppImage
