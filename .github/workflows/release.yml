name: Release

# Runs when a GitHub Release is published, or by hand (artifacts only, nothing attached).
# Each build job smoke-tests its file and uploads it as a workflow artifact. The release
# gets the files only if both jobs succeed (job "publish"), so it is never half-published.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the release tag against the project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python packaging/check_release_tag.py "$TAG"

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libxcb-cursor0 libegl1 libgl1

      - name: Build the AppImage
        run: packaging/build-linux.sh

      - name: Smoke test
        run: packaging/smoke-test.sh dist/nexplorer-v*-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v5
        with:
          name: nexplorer-linux-x86_64
          path: dist/nexplorer-v*-linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the release tag against the project version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python packaging/check_release_tag.py "$TAG"

      - name: Build the zip
        shell: pwsh
        run: packaging/build-windows.ps1

      - name: Unpack the zip
        shell: pwsh
        run: Expand-Archive dist/nexplorer-v*-windows-x64.zip -DestinationPath unpacked

      - name: Smoke test the unpacked program
        shell: bash
        run: packaging/smoke-test.sh unpacked/nexplorer-v*/nexplorer.exe

      - uses: actions/upload-artifact@v5
        with:
          name: nexplorer-windows-x64
          path: dist/nexplorer-v*-windows-x64.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # attach the files to the release
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: files
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" files/*
